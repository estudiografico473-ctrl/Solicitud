<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DG•473 — Nueva Solicitud</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="glow-orb glow-orb-1"></div>
<div class="glow-orb glow-orb-2"></div>

<nav>
  <a href="index.html" class="nav-brand">
    <img src="favicon.png" alt="DG473" class="nav-favicon">
    <div class="nav-brand-dot"></div>
    DG•473
  </a>
  <div class="nav-links">
    <a href="index.html" class="nav-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>
      Estado de Pedidos
    </a>
    <a href="solicitud.html" class="nav-link active">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Nueva Solicitud
    </a>
  </div>
</nav>

<main class="form-main">
  <div class="form-page-header">
    <div class="page-tag">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5"/></svg>
      Nuevo pedido
    </div>
    <h1 class="page-title form-page-title">Solicitud de <span>Diseño</span></h1>
    <p class="page-subtitle">Completá el formulario con los detalles del trabajo. Una vez enviado, aparecerá en el panel de Estado de Pedidos.</p>
  </div>

  <div class="form-card">
    <form id="solicitudForm" novalidate>
      <div class="form-grid">

        <div class="form-group">
          <label for="fechaPedido">Fecha de Pedido <span class="req">*</span></label>
          <input type="date" id="fechaPedido" name="fechaPedido" required>
        </div>

        <div class="form-group">
          <label for="solicita">Solicita <span class="req">*</span></label>
          <input type="text" id="solicita" name="solicita" placeholder="Nombre de quien solicita" required>
        </div>

        <div class="form-group">
          <label for="unidad">Unidad de Negocio <span class="req">*</span></label>
          <input type="text" id="unidad" name="unidad" placeholder="Ej: Marketing, Ventas...">
        </div>

        <div class="form-group">
          <label for="tipoDiseno">Tipo de Diseño <span class="req">*</span></label>
          <input type="text" id="tipoDiseno" name="tipoDiseno" placeholder="Ej: Flyer, Banner, Branding...">
        </div>

        <div class="form-divider"></div>

        <div class="form-group full">
          <label for="detalle">Detalle del Diseño <span class="req">*</span></label>
          <textarea id="detalle" name="detalle" placeholder="Describí con detalle qué necesitás: dimensiones, colores, textos, referencias visuales, etc." required oninput="updateCharCount(this)"></textarea>
          <div class="char-count" id="charCount">0 caracteres</div>
        </div>

        <div class="form-divider"></div>

        <div class="form-group">
          <label for="fechaAsignada">Fecha Asignada</label>
          <input type="date" id="fechaAsignada" name="fechaAsignada">
        </div>

        <div class="form-group">
          <label for="prioridad">Prioridad <span class="req">*</span></label>
          <select id="prioridad" name="prioridad" required onchange="updatePriorityPreview(this.value)">
            <option value="" disabled selected>Seleccioná la prioridad</option>
            <option value="Urgente">🔴 Urgente</option>
            <option value="Intermedio">🟡 Intermedio</option>
            <option value="Normal">🔵 Normal</option>
          </select>
          <div class="priority-preview" id="priorityPreview" style="opacity:0; transition:opacity 0.3s;">
            <span class="priority-chip p-urgente">Urgente</span>
            <span class="priority-chip p-intermedio">Intermedio</span>
            <span class="priority-chip p-normal">Normal</span>
          </div>
        </div>

      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-ghost" onclick="clearForm()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6M10 11v6M14 11v6M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
          Borrar
        </button>
        <button type="submit" class="btn btn-primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          Enviar Solicitud
        </button>
      </div>
    </form>
  </div>
</main>

<div class="toast toast-success" id="toast">
  <div class="toast-icon">✓</div>
  Solicitud enviada · Redirigiendo...
</div>

<script>
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('fechaPedido').value = today;

  function updateCharCount(el) {
    document.getElementById('charCount').textContent = el.value.length + ' caracteres';
  }

  function updatePriorityPreview(val) {
    document.getElementById('priorityPreview').style.opacity = val ? '1' : '0';
  }

  function clearForm() {
    if (confirm('¿Querés borrar todos los campos?')) {
      document.getElementById('solicitudForm').reset();
      document.getElementById('fechaPedido').value = today;
      document.getElementById('charCount').textContent = '0 caracteres';
      document.getElementById('priorityPreview').style.opacity = '0';
    }
  }

  document.getElementById('solicitudForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const fields = ['fechaPedido','solicita','unidad','tipoDiseno','detalle','prioridad'];
    let valid = true;

    fields.forEach(function(id) {
      const el = document.getElementById(id);
      if (!el.value.trim()) {
        el.style.borderColor = 'var(--danger)';
        el.style.boxShadow = '0 0 0 3px rgba(255,71,87,0.15)';
        valid = false;
        el.addEventListener('input', function() {
          this.style.borderColor = '';
          this.style.boxShadow = '';
        }, { once: true });
      }
    });

    if (!valid) return;

    const record = {
      id: Date.now(),
      fechaPedido:   document.getElementById('fechaPedido').value,
      solicita:      document.getElementById('solicita').value.trim(),
      unidad:        document.getElementById('unidad').value.trim(),
      tipoDiseno:    document.getElementById('tipoDiseno').value.trim(),
      detalle:       document.getElementById('detalle').value.trim(),
      fechaAsignada: document.getElementById('fechaAsignada').value,
      prioridad:     document.getElementById('prioridad').value,
      estado:        'Sin Iniciar',
      correcciones:  '',
      link:          ''
    };

    const existing = JSON.parse(localStorage.getItem('solicitudes') || '[]');
    existing.push(record);
    localStorage.setItem('solicitudes', JSON.stringify(existing));

    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(function() { window.location.href = 'index.html'; }, 1800);
  });
</script>
</body>
</html>
